networks:
  dokploy-network:
    external: true
services:
  vibe-kanban:
    build: .
    container_name: vibe-server
    working_dir: /app
    ports:
      - "${VIBE_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
    volumes:
      - vibe_config:/home/node/.vibe-kanban # Root yerine node kullanıcısı dizini
      - vibe_data:/home/node/.local/share/vibe-kanban # Proje veritabanı (db.sqlite)
      - ${BASE_DIR:-.}/repos:/repos
      - ~/.ssh:/root/.ssh:ro
      - ${BASE_DIR:-.}/secrets:/root/secrets:ro
      - ${BASE_DIR:-.}/agents/claude:/home/node/.claude
      - ./dev-server.sh:/usr/local/bin/dev-server.sh:ro
    restart: unless-stopped
    networks:
      - dokploy-network

  # ====================================
  # CODE-SERVER (Browser-based VS Code)
  # ====================================
  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    ports:
      - "${CODE_PORT:-8443}:8080"
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-dev123}
      - DOCKER_USER=root
    volumes:
      - ${BASE_DIR:-.}/repos:/home/coder/repos # Same workspace as vibe-kanban (bind mount)
      - code_server_data:/home/coder # User data persist
      - ~/.ssh:/home/coder/.ssh:ro # Git SSH access
    restart: unless-stopped
    networks:
      - dokploy-network
  # ====================================
  # OPENCLAW (Personal AI Assistant)
  # ====================================
  openclaw:
    build:
      context: ./agents/openclaw
    container_name: openclaw-gateway
    # platform: linux/amd64  # Node 22 supports ARM64 natively
    restart: unless-stopped
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_DASHBOARD_PORT:-18790}:18790"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ${BASE_DIR:-.}/agents/openclaw/config:/home/node/.openclaw # Config storage (was .openclaw)
      - ${BASE_DIR:-.}/agents/openclaw/workspace:/home/node/openclaw # Workspace storage
      - ${BASE_DIR:-.}/repos:/repos # Shared repos access
    networks:
      - dokploy-network
volumes:
  vibe_config:
  vibe_data:
  code_server_data:
